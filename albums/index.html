<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Favorite albums from bon3301">

    <title>albums | bon3301</title>

    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../shared/site.css">
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <nav class="site-nav" aria-label="Primary navigation">
        <a class="site-mark" href="/" aria-label="Home">
            <svg
                class="rinnegan-icon"
                viewBox="0 0 64 64"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                aria-hidden="true">

                <circle cx="32" cy="32" r="29"></circle>
                <circle cx="32" cy="32" r="20"></circle>
                <circle cx="32" cy="32" r="11"></circle>

                <circle
                    cx="32"
                    cy="32"
                    r="3"
                    fill="currentColor"
                    stroke="none">
                </circle>

                <g fill="currentColor" stroke="none">
                    <circle cx="32" cy="12" r="2"></circle>
                    <circle cx="49.3" cy="42" r="2"></circle>
                    <circle cx="14.7" cy="42" r="2"></circle>
                </g>
            </svg>
        </a>

        <a href="/projects/" class="nav-link">projects</a>

        <a href="/blog/" class="nav-link">blog</a>

        <div class="dropdown">
            <button
                class="dropdown-toggle"
                type="button"
                aria-label="More pages"
                aria-expanded="false"
                aria-controls="more-menu">

                <span class="dropdown-arrow"></span>
            </button>

            <div class="dropdown-menu" id="more-menu">
                <a href="/#shows" class="dropdown-item">shows</a>
                <a
                    href="/albums/"
                    class="dropdown-item"
                    aria-current="page">
                    albums
                </a>
            </div>
        </div>
    </nav>

    <button
        class="theme-toggle"
        id="themeToggle"
        type="button"
        aria-label="Toggle theme">

        <i data-lucide="sun" class="sun-icon"></i>
        <i data-lucide="moon" class="moon-icon"></i>
    </button>

    <canvas id="canvas" aria-hidden="true"></canvas>

    <main>
        <header class="albums-header">
            <h1>albums</h1>

            <p>
                albums I like, carousel go wee
            </p>
        </header>

        <section class="album-browser" aria-label="Album collection">
            <div class="cover-flow">
                <button
                    class="flow-button"
                    id="previousAlbum"
                    type="button"
                    aria-label="Previous album">
                    &larr;
                </button>

                <div
                    class="cover-stage"
                    id="coverStage"
                    aria-live="polite">
                </div>

                <button
                    class="flow-button"
                    id="nextAlbum"
                    type="button"
                    aria-label="Next album">
                    &rarr;
                </button>
            </div>

            <div class="album-details">
                <p class="album-position" id="albumPosition"></p>
                <h2 id="albumTitle"></h2>
                <p id="albumArtist"></p>
            </div>

            <section class="track-panel" aria-labelledby="trackHeading">
                <div class="track-heading">
                    <h2 id="trackHeading">tracklist</h2>
                    <span id="trackCount"></span>
                </div>

                <ol class="track-list" id="trackList"></ol>
            </section>
        </section>
    </main>

    <script type="module" src="../shared/site.js"></script>
    <script type="module" src="./script.js"></script>
</body>

</html>

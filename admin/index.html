<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Private blog administration">

    <title>admin | bon3301</title>

    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../shared/site.css">
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <nav class="site-nav" aria-label="Primary navigation">
        <a class="site-mark" href="/" aria-label="Home">
            <svg
                class="rinnegan-icon"
                viewBox="0 0 64 64"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                aria-hidden="true">

                <circle cx="32" cy="32" r="29"></circle>
                <circle cx="32" cy="32" r="20"></circle>
                <circle cx="32" cy="32" r="11"></circle>

                <circle
                    cx="32"
                    cy="32"
                    r="3"
                    fill="currentColor"
                    stroke="none">
                </circle>

                <g fill="currentColor" stroke="none">
                    <circle cx="32" cy="12" r="2"></circle>
                    <circle cx="49.3" cy="42" r="2"></circle>
                    <circle cx="14.7" cy="42" r="2"></circle>
                </g>
            </svg>
        </a>

        <a href="/#projects" class="nav-link">projects</a>
        <a href="/blog/" class="nav-link">blog</a>

        <div class="dropdown">
            <button
                class="dropdown-toggle"
                type="button"
                aria-label="More pages"
                aria-expanded="false"
                aria-controls="more-menu">

                <span class="dropdown-arrow"></span>
            </button>

            <div class="dropdown-menu" id="more-menu">
                <a href="/#shows" class="dropdown-item">shows</a>
                <a href="/#albums" class="dropdown-item">albums</a>
            </div>
        </div>
    </nav>

    <button
        class="theme-toggle"
        id="themeToggle"
        type="button"
        aria-label="Toggle theme">

        <i data-lucide="sun" class="sun-icon"></i>
        <i data-lucide="moon" class="moon-icon"></i>
    </button>

    <canvas id="canvas" aria-hidden="true"></canvas>

    <main class="admin-main">
        <section class="admin-panel">
            <form class="login-form" id="login-form">
                <label class="visually-hidden" for="admin-password">
                    password
                </label>

                <input
                    id="admin-password"
                    name="password"
                    type="password"
                    placeholder="password"
                    aria-describedby="auth-message"
                    autocomplete="current-password"
                    maxlength="512"
                    required>

                <button
                    class="primary-button"
                    id="login-button"
                    type="submit">

                    sign in
                </button>

                <p
                    class="auth-message visually-hidden"
                    id="auth-message"
                    role="status"
                    aria-live="polite">
                </p>
            </form>

            <section
                class="admin-session"
                id="admin-session"
                hidden>

                <header class="dashboard-header">
                    <div>
                        <p class="dashboard-label">blog admin</p>
                        <h1>posts</h1>
                    </div>

                    <button
                        class="secondary-button"
                        id="logout-button"
                        type="button">

                        sign out
                    </button>
                </header>

                <p
                    class="auth-message visually-hidden"
                    id="session-message"
                    role="status"
                    aria-live="polite">
                </p>

                <section
                    class="admin-post-list"
                    id="admin-post-list"
                    aria-label="Admin blog posts"
                    aria-live="polite"
                    aria-busy="true">

                    <p class="admin-post-message">loading posts...</p>
                </section>
            </section>
        </section>
    </main>

    <script type="module" src="../shared/site.js"></script>
    <script type="module" src="./script.js"></script>
</body>

</html>

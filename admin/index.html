<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Private blog administration">

    <title>admin | bon3301</title>

    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../shared/site.css">
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <nav class="site-nav" aria-label="Primary navigation">
        <a class="site-mark" href="/" aria-label="Home">
            <svg
                class="rinnegan-icon"
                viewBox="0 0 64 64"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                aria-hidden="true">

                <circle cx="32" cy="32" r="29"></circle>
                <circle cx="32" cy="32" r="20"></circle>
                <circle cx="32" cy="32" r="11"></circle>

                <circle
                    cx="32"
                    cy="32"
                    r="3"
                    fill="currentColor"
                    stroke="none">
                </circle>

                <g fill="currentColor" stroke="none">
                    <circle cx="32" cy="12" r="2"></circle>
                    <circle cx="49.3" cy="42" r="2"></circle>
                    <circle cx="14.7" cy="42" r="2"></circle>
                </g>
            </svg>
        </a>

        <a href="/projects/" class="nav-link">projects</a>
        <a href="/blog/" class="nav-link">blog</a>

        <div class="dropdown">
            <button
                class="dropdown-toggle"
                type="button"
                aria-label="More pages"
                aria-expanded="false"
                aria-controls="more-menu">

                <span class="dropdown-arrow"></span>
            </button>

            <div class="dropdown-menu" id="more-menu">
                <a href="/#shows" class="dropdown-item">shows</a>
                <a href="/albums/" class="dropdown-item">albums</a>
            </div>
        </div>
    </nav>

    <button
        class="theme-toggle"
        id="themeToggle"
        type="button"
        aria-label="Toggle theme">

        <i data-lucide="sun" class="sun-icon"></i>
        <i data-lucide="moon" class="moon-icon"></i>
    </button>

    <canvas id="canvas" aria-hidden="true"></canvas>

    <main class="admin-main">
        <section class="admin-panel">
            <form class="login-form" id="login-form">
                <label class="visually-hidden" for="admin-password">
                    password
                </label>

                <input
                    id="admin-password"
                    name="password"
                    type="password"
                    placeholder="password"
                    aria-describedby="auth-message"
                    autocomplete="current-password"
                    maxlength="512"
                    required>

                <button
                    class="primary-button"
                    id="login-button"
                    type="submit">

                    sign in
                </button>

                <p
                    class="auth-message visually-hidden"
                    id="auth-message"
                    role="status"
                    aria-live="polite">
                </p>
            </form>

            <section
                class="admin-session"
                id="admin-session"
                hidden>

                <div class="dashboard-view" id="dashboard-view">

                <header class="dashboard-header">
                    <div>
                        <p class="dashboard-label">blog admin</p>
                        <h1>posts</h1>
                    </div>

                    <div class="dashboard-actions">
                        <button
                            class="primary-button"
                            id="new-post-button"
                            type="button">

                            new post
                        </button>

                        <button
                            class="secondary-button"
                            id="logout-button"
                            type="button">

                            sign out
                        </button>
                    </div>
                </header>

                <form
                    class="new-post-form"
                    id="new-post-form"
                    hidden>

                    <label class="visually-hidden" for="new-post-title">
                        post title
                    </label>

                    <div class="new-post-controls">
                        <input
                            id="new-post-title"
                            name="title"
                            type="text"
                            placeholder="post title"
                            autocomplete="off"
                            maxlength="200"
                            required>

                        <button
                            class="primary-button"
                            id="create-post-button"
                            type="submit">

                            create draft
                        </button>

                        <button
                            class="secondary-button"
                            id="cancel-post-button"
                            type="button">

                            cancel
                        </button>
                    </div>

                    <p
                        class="new-post-message"
                        id="new-post-message"
                        role="status"
                        aria-live="polite">
                    </p>
                </form>

                <p
                    class="auth-message visually-hidden"
                    id="session-message"
                    role="status"
                    aria-live="polite">
                </p>

                <section
                    class="admin-post-list"
                    id="admin-post-list"
                    aria-label="Admin blog posts"
                    aria-live="polite"
                    aria-busy="true">

                    <p class="admin-post-message">loading posts...</p>
                </section>
                </div>

                <form class="post-editor" id="post-editor" hidden>
                    <header class="editor-header">
                        <div>
                            <button
                                class="editor-back"
                                id="editor-back-button"
                                type="button">

                                ← posts
                            </button>

                            <p class="dashboard-label" id="editor-meta">
                                loading post...
                            </p>
                        </div>

                        <div class="editor-actions">
                            <button
                                class="secondary-button danger-button"
                                id="delete-post-button"
                                type="button"
                                hidden>

                                delete
                            </button>

                            <button
                                class="secondary-button publish-button"
                                id="publish-button"
                                type="button"
                                data-status="draft">

                                publish
                            </button>

                            <button
                                class="primary-button"
                                id="save-post-button"
                                type="submit">

                                save draft
                            </button>
                        </div>
                    </header>

                    <div
                        class="editor-url-preview"
                        id="editor-url-preview"
                        data-status="draft">

                        <span class="url-status-dot" aria-hidden="true"></span>

                        <div class="editor-url-value">
                            <span id="editor-url-origin"></span>

                            <input
                                id="editor-slug"
                                type="text"
                                maxlength="160"
                                pattern="[a-z0-9]+(-[a-z0-9]+)*"
                                autocomplete="off"
                                spellcheck="false"
                                aria-label="Public post URL">

                            <span>/</span>
                        </div>
                    </div>

                    <label class="editor-field">
                        <span>title</span>

                        <input
                            id="editor-title"
                            type="text"
                            maxlength="200"
                            required>
                    </label>

                    <label class="editor-field">
                        <span>excerpt</span>

                        <textarea
                            id="editor-excerpt"
                            rows="3"
                            maxlength="300"
                            placeholder="Short description shown on the blog">
                        </textarea>
                    </label>

                    <div class="editor-workspace">
                        <label class="editor-field editor-markdown-pane">
                            <span>markdown</span>

                            <textarea
                                class="markdown-input"
                                id="editor-content"
                                rows="18"
                                maxlength="100000"
                                spellcheck="true"
                                placeholder="Start writing...">
                            </textarea>
                        </label>

                        <section
                            class="editor-preview-pane"
                            aria-label="Markdown preview">

                            <span class="editor-pane-label">preview</span>

                            <article
                                class="markdown-preview empty"
                                id="markdown-preview">

                                Nothing to preview yet.
                            </article>
                        </section>
                    </div>

                    <footer class="editor-footer">
                        <span id="editor-reading-time">1 min read</span>

                        <span
                            class="editor-message"
                            id="editor-message"
                            role="status"
                            aria-live="polite">
                        </span>
                    </footer>
                </form>
            </section>
        </section>
    </main>

    <script type="module" src="../shared/site.js"></script>
    <script type="module" src="./script.js"></script>
</body>

</html>
